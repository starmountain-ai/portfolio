<style>
/* Layout: 순위 목록 | 입력 패널 | A4 미리보기 — 작성과 결과를 한 화면에서 */
:root{
  --bg:#f3f5f8; --surface:#ffffff; --ink:#1b2232; --muted:#5b6476; --line:#dde2ea;
  --accent:#23408f; --accent-soft:#e7ecf8; --seal:#c62f28; --warn-bg:#fff4e0; --warn-ink:#8a5200;
  --doc-bg:#ffffff; --doc-ink:#14171f; --doc-line:#3a3f4b; --doc-soft:#f2f3f5;

}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){

:root[data-theme="dark"]{
  --bg:#11141b; --surface:#191e28; --ink:#e5e8ee; --muted:#9aa2b1; --line:#2b3240;
  --accent:#8ea6ef; --accent-soft:#222c44; --seal:#e85a50; --warn-bg:#3a2c12; --warn-ink:#f2c47a;
  --doc-bg:#f4f4f2; --doc-ink:#14171f; --doc-line:#3a3f4b; --doc-soft:#e6e7e9; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:14px;line-height:1.55}
.wrap{max-width:1440px;margin:0 auto;padding-inline:16px;padding-block:20px 40px}
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:8px 24px;margin-bottom:18px}

nav.rank button[aria-current="true"]{background:var(--accent);color:#fff}
:root[data-theme="dark"] nav.rank button[aria-current="true"]{color:#11141b}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) nav.rank button[aria-current="true"]{color:#11141b}}
.no{font-variant-numeric:tabular-nums;font-weight:700;width:22px;text-align:right;opacity:.75;font-size:12px}

section.editor{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}

section.preview{min-width:0}
.pv-bar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.pv-bar span{font-size:12px;color:var(--muted)}
.paper{background:var(--doc-bg);color:var(--doc-ink);font-family:var(--doc);max-width:794px;margin:0 auto;padding:56px 60px;border-radius:3px;box-shadow:0 1px 2px rgba(0,0,0,.08),0 8px 28px rgba(20,30,60,.10);font-size:14.5px;line-height:1.85;min-height:900px}
.paper h3{font-size:26px;text-align:center;letter-spacing:.5em;margin:0 0 28px;padding-left:.5em;font-weight:700}
.paper h3.sm{letter-spacing:.15em}
.paper table{width:100%;border-collapse:collapse;margin:10px 0 16px;font-size:13.5px}
.paper th,.paper td{border:1px solid var(--doc-line);padding:6px 8px;vertical-align:top;text-align:left}
.paper th{background:var(--doc-soft);font-weight:700;white-space:nowrap;width:1%}
.paper td.r,.paper th.r{text-align:right;font-variant-numeric:tabular-nums}
.paper td.c,.paper th.c{text-align:center}
.paper p{margin:0 0 10px}
.paper .art{margin:0 0 9px}
.paper .art b{margin-right:6px}
.paper .date{text-align:center;margin:30px 0 22px;font-size:15px}
.paper .sign{margin-left:auto;width:max-content;max-width:100%;display:grid;gap:6px}
.paper .sign div{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.seal{display:inline-grid;place-items:center;width:30px;height:30px;border:2px solid var(--seal);color:var(--seal);border-radius:50%;font-size:12px;font-weight:700;font-family:var(--doc);transform:rotate(-6deg)}
.paper .big{font-size:16px;font-weight:700;text-align:center;margin:8px 0 18px}
.paper .to{font-size:17px;font-weight:700;text-align:center;margin-top:24px}
.paper .sec{font-weight:700;margin:18px 0 6px;font-size:15px}
.paper .para{white-space:pre-wrap}
.empty{color:#9097a3}
.tblwrap{overflow-x:auto}
@media (max-width:1100px){
  .grid{grid-template-columns:minmax(0,1fr) minmax(0,1.3fr)}
  nav.rank{grid-column:1/-1;position:static;display:flex;gap:4px;overflow-x:auto;padding:6px}
  nav.rank .cap{display:none}
  nav.rank button{width:auto;white-space:nowrap;flex:0 0 auto}
  nav.rank .tag{display:none}
}
@media (max-width:760px){
  .grid{grid-template-columns:minmax(0,1fr)}

}
@media (prefers-reduced-motion:no-preference){.paper{transition:box-shadow .2s}}
</style>

<div class="wrap">
  <header class="top">
    <div>
      <h1>서식공방 <span>TOP 10</span></h1>
      <p>국내 서식 플랫폼 인기 검색어 상위 10개를 바로 작성하는 양식으로 만들었습니다. 왼쪽에서 고르고, 입력하면 오른쪽 문서가 바로 바뀝니다.</p>
    </div>
    <div class="src">순위 기준: 예스폼 메인 인기 키워드 (2026.10.08 확인)</div>
  </header>

  <div class="grid">
    <nav class="rank" id="rank" aria-label="인기 서식 순위"><div class="cap">인기 검색 순위</div></nav>

<script>
(function(){
const MINWAGE_2026 = 10320; // 2026년 최저시급(원)
const pad = n => String(n).padStart(2,'0');
const iso = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const plus = (days) => { const d=new Date(); d.setDate(d.getDate()+days); return iso(d); };
const plusY = (y) => { const d=new Date(); d.setFullYear(d.getFullYear()+y); return iso(d); };
const TODAY = iso(new Date());
const e = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const v = (s,ph) => (s && String(s).trim()) ? e(s) : '<span class="empty">'+(ph||'　　　　')+'</span>';
const fd = s => { if(!s) return '<span class="empty">　년　월　일</span>'; const [y,m,d]=s.split('-'); return `${y}년 ${+m}월 ${+d}일`; };
const num = s => { const n = Number(String(s||'').replace(/[^\d.]/g,'')); return isFinite(n)?n:0; };
const won = n => Math.round(n).toLocaleString('ko-KR');
function hangul(n){
  n = Math.floor(n); if(!n) return '영';
  const dg='　일이삼사오육칠팔구'.split(''), su=['','십','백','천'], bu=['','만','억','조'];
  let out='', b=0;
  while(n>0){
    const chunk=n%10000; n=Math.floor(n/10000);
    if(chunk){ let s='', c=chunk, i=0;
      while(c>0){ const d=c%10; if(d) s=(d===1&&i>0?'':dg[d])+su[i]+s; c=Math.floor(c/10); i++; }
      out=s+bu[b]+out; }
    b++;
  }
  return out;
}
const amt = n => n ? `일금 ${hangul(n)}원정 (₩${won(n)})` : '<span class="empty">일금　　　　원정 (₩　　　)</span>';
const lines = s => String(s||'').split('\n').map(x=>x.trim()).filter(Boolean);
const seal = '<span class="seal">인</span>';
const signBlock = rows => '<div class="sign">'+rows.map(r=>`<div><span>${r[0]}</span><b>${r[1]}</b>${r[2]===false?'':seal}</div>`).join('')+'</div>';

/* ---------- 서식 정의 ---------- */
const FORMS = [
{ id:'resume', rank:1, name:'이력서', tag:'취업',
  desc:'인적사항·학력·경력·자격을 표로 정리하는 기본 이력서입니다. 한 줄에 하나씩, 칸은 | 로 나눠 입력하세요.',
  fields:[
    {g:'인적사항'},
    {id:'name',l:'성명',s:'김하늘'},{id:'birth',l:'생년월일',t:'date',s:'1995-04-12'},
    {id:'phone',l:'연락처',s:'010-1234-5678'},{id:'email',l:'이메일',s:'haneul.kim@example.com'},
    {id:'addr',l:'주소',s:'광주광역시 서구 상무중앙로 00'},
    {g:'학력 · 경력 · 자격'},
    {id:'edu',l:'학력 (기간 | 학교 | 전공·구분)',t:'area',s:'2014.03 ~ 2020.02 | 전남대학교 | 경영학과 졸업\n2011.03 ~ 2014.02 | 광주고등학교 | 졸업'},
    {id:'career',l:'경력 (기간 | 회사 | 직위·업무)',t:'area',s:'2022.03 ~ 현재 | (주)한빛유통 | 대리 · 온라인 판매 기획\n2020.03 ~ 2022.02 | 다온마케팅 | 사원 · SNS 광고 운영'},
    {id:'cert',l:'자격·면허 (취득일 | 자격명 | 발행처)',t:'area',s:'2021.06 | 컴퓨터활용능력 1급 | 대한상공회의소\n2019.11 | 운전면허 2종 보통 | 경찰청'},
  ],
  render(x){
    const rows=(s,n)=>{const L=lines(s); if(!L.length) return `<tr><td colspan="${n}" class="c"><span class="empty">입력한 내용이 여기에 표시됩니다</span></td></tr>`;
      return L.map(l=>{const c=l.split('|').map(t=>t.trim()); while(c.length<n)c.push(''); return '<tr>'+c.slice(0,n).map((t,i)=>`<td${i===0?' style="white-space:nowrap"':''}>${e(t)}</td>`).join('')+'</tr>';}).join('');};
    return `<h3>이 력 서</h3>
    <div class="tblwrap"><table><tr><th>성 명</th><td>${v(x.name)}</td><th>생년월일</th><td>${x.birth?fd(x.birth):v('')}</td></tr>
    <tr><th>연락처</th><td>${v(x.phone)}</td><th>이메일</th><td>${v(x.email)}</td></tr>
    <tr><th>주 소</th><td colspan="3">${v(x.addr)}</td></tr></table></div>
    <div class="sec">학력사항</div><div class="tblwrap"><table><tr><th>기간</th><th>학교명</th><th>전공 · 구분</th></tr>${rows(x.edu,3)}</table></div>
    <div class="sec">경력사항</div><div class="tblwrap"><table><tr><th>기간</th><th>회사명</th><th>직위 · 담당업무</th></tr>${rows(x.career,3)}</table></div>
    <div class="sec">자격 · 면허</div><div class="tblwrap"><table><tr><th>취득일</th><th>자격명</th><th>발행처</th></tr>${rows(x.cert,3)}</table></div>
    <p style="text-align:center;margin-top:26px">위의 기재 사항은 사실과 틀림없음을 확인합니다.</p>
    <div class="date">${fd(TODAY)}</div>${signBlock([['작성자',v(x.name)]])}`;
  }},

{ id:'loan', rank:2, name:'차용증', tag:'생활',
  desc:'개인 간 금전 대여 사실과 변제 조건을 남기는 차용증입니다. 금액은 숫자로 넣으면 한글 금액이 자동으로 써집니다.',
  fields:[
    {g:'빌린 돈'},
    {id:'amount',l:'차용 금액 (원)',t:'num',s:'5000000'},
    {id:'date',l:'차용일',t:'date',s:TODAY},{id:'due',l:'변제기일',t:'date',s:plus(180)},
    {id:'rate',l:'이자율 (연 %, 무이자는 0)',t:'num',s:'5'},
    {id:'pay',l:'변제 방법',s:'채권자 명의 계좌(○○은행 000-0000-0000)로 이체'},
    {g:'채권자 (빌려준 사람)'},
    {id:'cName',l:'성명',s:'박정민'},{id:'cAddr',l:'주소',s:'광주광역시 북구 용봉로 00'},
    {g:'채무자 (빌린 사람)'},
    {id:'dName',l:'성명',s:'이서준'},{id:'dAddr',l:'주소',s:'광주광역시 남구 봉선로 00'},{id:'dPhone',l:'연락처',s:'010-9876-5432'},
    {g:'특약'},
    {id:'extra',l:'특약 사항 (선택)',t:'area',s:'채무자가 변제기일까지 갚지 못한 경우, 지연 기간에 대하여 연 12%의 지연손해금을 더하여 지급한다.'},
  ],
  warn(x){ return num(x.rate)>20 ? '이자율이 연 20%를 넘습니다. 법정 최고이자율(연 20%)을 초과하는 부분은 무효가 될 수 있습니다.' : ''; },
  render(x){
    const r=num(x.rate);
    return `<h3>차 용 증</h3>
    <div class="big">${amt(num(x.amount))}</div>
    <p>채무자는 위 금액을 채권자로부터 아래 조건으로 정히 빌렸음을 확인하며, 다음 사항을 지킬 것을 약속합니다.</p>
    <div class="art"><b>1. 차용일</b>${fd(x.date)}</div>
    <div class="art"><b>2. 변제기일</b>${fd(x.due)}까지 원금 전액을 갚는다.</div>
    <div class="art"><b>3. 이자</b>${r?`연 ${e(x.rate)}%로 하며, 매월 말일에 지급한다.`:'이자는 없는 것으로 한다.'}</div>
    <div class="art"><b>4. 변제 방법</b>${v(x.pay)}</div>
    <div class="art"><b>5. 기한이익 상실</b>채무자가 이자 지급을 2회 이상 미루거나 다른 채권자로부터 압류 등을 받은 경우, 채권자의 청구가 있으면 기한 전이라도 즉시 전액을 갚는다.</div>
    ${x.extra&&x.extra.trim()?`<div class="art"><b>6. 특약</b><span class="para">${e(x.extra)}</span></div>`:''}

    {id:'name',l:'성명',s:'김하늘'},{id:'company',l:'지원 회사',s:'(주)스마트커머스'},{id:'role',l:'지원 직무',s:'온라인 마케팅'},
    {id:'q1',l:'성장 과정',t:'area',cnt:1,s:'작은 가게를 하시던 부모님 곁에서 손님 한 분 한 분을 기억하는 법을 배웠습니다. 단골의 취향을 메모해 두었다가 다음 방문 때 먼저 권하던 경험은, 지금도 고객 데이터를 볼 때 "이 숫자 뒤에 어떤 사람이 있는가"를 먼저 생각하게 만듭니다.'},
    {id:'q2',l:'성격의 장단점',t:'area',cnt:1,s:'끝까지 원인을 파고드는 집요함이 장점입니다. 광고 성과가 떨어졌을 때 시간대·소재·연령별로 나눠 분석해 클릭률을 1.8배 올렸습니다. 다만 혼자 해결하려는 습관이 있어, 지금은 막히는 지점을 하루 안에 팀과 공유하는 원칙을 지키고 있습니다.'},
    {id:'q3',l:'지원 동기',t:'area',cnt:1,s:'귀사가 소상공인 판매자의 성장을 돕는 플랫폼이라는 점에 끌렸습니다. 제가 SNS 광고 운영으로 쌓은 경험을 판매자 성장 프로그램에 연결해, 작은 가게도 데이터로 성장할 수 있다는 것을 보여 주고 싶습니다.'},
    {id:'q4',l:'입사 후 포부',t:'area',cnt:1,s:'입사 1년 안에 판매자 대상 광고 운영 가이드를 만들고, 3년 안에 신규 판매자의 첫 달 매출을 높이는 온보딩 프로그램을 기획하겠습니다.'},
  ],
  render(x){
    const sec=(t,s)=>`<div class="sec">${t}</div><p class="para" style="text-indent:1em">${s&&s.trim()?e(s):'<span class="empty">내용을 입력하세요</span>'}</p>`;

    <div class="tblwrap"><table><tr><th>성 명</th><td>${v(x.name)}</td><th>지원 회사</th><td>${v(x.company)}</td><th>직무</th><td>${v(x.role)}</td></tr></table></div>
    ${sec('1. 성장 과정',x.q1)}${sec('2. 성격의 장단점',x.q2)}${sec('3. 지원 동기',x.q3)}${sec('4. 입사 후 포부',x.q4)}`;

{ id:'proxy', rank:8, name:'위임장', tag:'생활',
  desc:'관공서·은행 등에서 서류 발급이나 업무를 대신 맡길 때 쓰는 위임장입니다.',
  fields:[

  desc:'인기 9위 "부동산임대차계약서"와 10위 "임대차계약서"를 하나로 묶었습니다. 전세·월세 모두 쓸 수 있고, 금액은 한글로 자동 표기됩니다.',
  fields:[
    {g:'부동산'},
    {id:'loc',l:'소재지',s:'광주광역시 서구 상무대로 00, 101동 1203호'},
    {id:'kind',l:'건물 종류 · 면적',s:'아파트 · 전용 84.9㎡'},
    {id:'type',l:'계약 종류',t:'sel',o:['월세','전세'],s:'월세'},
    {g:'금액'},
    {id:'deposit',l:'보증금 (원)',t:'num',s:'30000000'},
    {id:'down',l:'계약금 (원)',t:'num',s:'3000000'},
    {id:'rent',l:'월 차임 (원, 전세는 비움)',t:'num',s:'700000'},
    {id:'rentDay',l:'차임 지급일',s:'매월 25일'},
    {g:'기간'},
    {id:'from',l:'인도일 (입주일)',t:'date',s:plus(30)},{id:'to',l:'만료일',t:'date',s:plusY(2)},
    {g:'임대인'},
    {id:'lName',l:'성명',s:'박정민'},{id:'lAddr',l:'주소',s:'광주광역시 북구 용봉로 00'},{id:'lPhone',l:'연락처',s:'010-3333-4444'},
    {g:'임차인'},
    {id:'tName',l:'성명',s:'정다은'},{id:'tAddr',l:'주소',s:'광주광역시 광산구 수완로 00'},{id:'tPhone',l:'연락처',s:'010-2222-3333'},
    {g:'특약'},
    {id:'extra',l:'특약 사항',t:'area',s:'1. 임대인은 잔금 지급일 다음 날까지 현 상태의 근저당 등 권리관계를 변동시키지 않는다.\n2. 입주 전 도배·장판은 임대인 부담으로 교체한다.\n3. 반려동물 사육은 임대인과 협의한다.'},
  ],
  render(x){
    const dep=num(x.deposit), down=num(x.down), rent=num(x.rent), bal=Math.max(0,dep-down), monthly=x.type==='월세';
    return `<h3 class="sm">부동산(${e(x.type||'월세')}) 임대차계약서</h3>
    <p>임대인과 임차인은 아래 표시 부동산에 관하여 다음과 같이 임대차계약을 체결한다.</p>
    <div class="sec">1. 부동산의 표시</div>
    <div class="tblwrap"><table><tr><th>소재지</th><td>${v(x.loc)}</td></tr><tr><th>종류·면적</th><td>${v(x.kind)}</td></tr></table></div>
    <div class="sec">2. 계약 내용</div>
    <div class="tblwrap"><table>
      <tr><th>보증금</th><td>${amt(dep)}</td></tr>
      <tr><th>계약금</th><td>${amt(down)} 은 계약 시 지급하고 영수함.</td></tr>
      <tr><th>잔금</th><td>${amt(bal)} 은 ${fd(x.from)}에 지급한다.</td></tr>
      ${monthly?`<tr><th>차임(월세)</th><td>${amt(rent)} 은 ${v(x.rentDay)}에 지급한다.</td></tr>`:''}
    </table></div>
    <div class="art"><b>제1조 (존속기간)</b>임대인은 위 부동산을 ${fd(x.from)}까지 임차인에게 인도하며, 임대차 기간은 인도일로부터 ${fd(x.to)}까지로 한다.</div>
    <div class="art"><b>제2조 (용도 변경 및 전대)</b>임차인은 임대인의 동의 없이 위 부동산의 용도나 구조를 바꾸거나 전대·양도할 수 없다.</div>
    <div class="art"><b>제3조 (계약의 해지)</b>임차인의 차임 연체액이 2기의 차임액에 이르거나 제2조를 위반한 경우, 임대인은 즉시 계약을 해지할 수 있다.</div>
    <div class="art"><b>제4조 (계약의 종료)</b>계약이 종료되면 임차인은 위 부동산을 원상으로 회복하여 반환하고, 임대인은 보증금을 임차인에게 돌려준다.</div>
    <div class="art"><b>제5조 (계약의 해제)</b>임차인이 잔금을 지급하기 전까지 임대인은 계약금의 두 배를 돌려주고, 임차인은 계약금을 포기하고 이 계약을 해제할 수 있다.</div>
    <div class="art"><b>제6조 (채무불이행)</b>어느 한쪽이 계약 내용을 이행하지 않으면 상대방은 서면으로 이행을 요구한 뒤 계약을 해제하고 손해배상을 청구할 수 있다.</div>
    ${x.extra&&x.extra.trim()?`<div class="sec">특약 사항</div><p class="para">${e(x.extra)}</p>`:''}
    <p style="margin-top:14px">이 계약을 증명하기 위하여 계약 당사자가 이의 없음을 확인하고 각각 서명·날인한다.</p>
    <div class="date">${fd(TODAY)}</div>
    <div class="tblwrap"><table>
      <tr><th rowspan="2">임대인</th><th>주소</th><td colspan="3">${v(x.lAddr)}</td></tr><tr><th>성명</th><td>${v(x.lName)} ${seal}</td><th>전화</th><td>${v(x.lPhone)}</td></tr>
      <tr><th rowspan="2">임차인</th><th>주소</th><td colspan="3">${v(x.tAddr)}</td></tr><tr><th>성명</th><td>${v(x.tName)} ${seal}</td><th>전화</th><td>${v(x.tPhone)}</td></tr>
    </table></div>
    <p style="font-size:12.5px">※ 주택은 계약 후 전입신고와 확정일자를 꼭 받으세요. 공인중개사를 통한 거래라면 중개사 정보란을 추가하세요.</p>`;
  }},
];

/* ---------- 상태 ---------- */
const KEY='seogong-v1';
let store={}; try{ store=JSON.parse(localStorage.getItem(KEY)||'{}')||{}; }catch(_){ store={}; }
const save=()=>{ try{ localStorage.setItem(KEY,JSON.stringify(store)); }catch(_){} };
const sample = f => { const o={}; f.fields.forEach(d=>{ if(d.id) o[d.id]=Array.isArray(d.s)?d.s.map(r=>r.slice()):(d.s??''); }); return o; };
const blank = f => { const o={}; f.fields.forEach(d=>{ if(d.id) o[d.id]= d.t==='items'?[['','','','']]: d.t==='sel'?d.o[0]:''; }); return o; };
let cur = FORMS[0].id;
try{ const h=location.hash.slice(1); if(FORMS.some(f=>f.id===h)) cur=h; else if(store.__cur && FORMS.some(f=>f.id===store.__cur)) cur=store.__cur; }catch(_){}
const vals = f => store[f.id] || (store[f.id]=sample(f));

const $=id=>document.getElementById(id);
const rank=$('rank');
FORMS.forEach(f=>{
  const b=document.createElement('button'); b.type='button'; b.dataset.id=f.id;
  b.innerHTML=`<span class="no">${f.rank===9?'9·10':f.rank}</span><span>${f.name}</span><span class="tag">${f.tag.split(' ')[0]}</span>`;
  b.onclick=()=>{ cur=f.id; store.__cur=cur; save(); build(); };
  rank.appendChild(b);
});

function counts(s){ s=s||''; return `공백 포함 ${s.length.toLocaleString()}자 · 공백 제외 ${s.replace(/\s/g,'').length.toLocaleString()}자`; }

function build(){
  const f=FORMS.find(x=>x.id===cur), x=vals(f);
  rank.querySelectorAll('button').forEach(b=>b.setAttribute('aria-current', b.dataset.id===cur?'true':'false'));
  $('edTitle').textContent=f.name; $('edDesc').textContent=f.desc;
  $('pvInfo').textContent=`${f.name} · A4 미리보기`;
  const box=$('fields'); box.innerHTML='';
  const warnEl=document.createElement('div'); warnEl.className='warn'; warnEl.hidden=true;
  f.fields.forEach(d=>{
    if(d.g){ const g=document.createElement('div'); g.className='grp'; g.textContent=d.g; box.appendChild(g); return; }
    if(d.t==='items'){ box.appendChild(itemsEditor(f,x)); return; }
    const lab=document.createElement('label'); lab.className='f'; lab.htmlFor=`f-${f.id}-${d.id}`;
    lab.appendChild(document.createTextNode(d.l));
    let el;
    if(d.t==='area'){ el=document.createElement('textarea'); }
    else if(d.t==='sel'){ el=document.createElement('select'); d.o.forEach(o=>{const op=document.createElement('option'); op.textContent=o; el.appendChild(op);}); }
    else { el=document.createElement('input'); el.type= d.t==='date'?'date': d.t==='time'?'time':'text'; if(d.t==='num') el.inputMode='numeric'; }
    el.id=`f-${f.id}-${d.id}`; el.value=x[d.id]??'';
    lab.appendChild(el);
    let cnt; if(d.cnt){ cnt=document.createElement('div'); cnt.className='count'; cnt.textContent=counts(el.value); lab.appendChild(cnt); }
    if(d.t==='num'){ const h=document.createElement('div'); h.className='hint'; const upd=()=>{const n=num(el.value); h.textContent=n?`${won(n)}원 · ${hangul(n)}원`:'';}; upd(); lab.appendChild(h); el.addEventListener('input',upd); }
    if(d.h){ const h=document.createElement('div'); h.className='hint'; h.textContent=d.h; lab.appendChild(h); }
    el.addEventListener('input',()=>{ x[d.id]=el.value; if(cnt) cnt.textContent=counts(el.value); save(); paint(f,x,warnEl); });
    box.appendChild(lab);
  });
  box.appendChild(warnEl);
  paint(f,x,warnEl);
}

function itemsEditor(f,x){
  const wrap=document.createElement('div'); wrap.className='items';
  const draw=()=>{
    wrap.innerHTML='<div class="irow ihead"><span>품명</span><span>규격</span><span>수량</span><span>단가</span><span></span></div>';
    x.items.forEach((r,i)=>{
      const row=document.createElement('div'); row.className='irow';
      ['품명','규격','수량','단가'].forEach((ph,j)=>{ const inp=document.createElement('input'); inp.id=`it-${i}-${j}`; inp.placeholder=ph; inp.setAttribute('aria-label',`${i+1}행 ${ph}`); inp.value=r[j]??''; if(j>1) inp.inputMode='numeric';
        inp.addEventListener('input',()=>{ r[j]=inp.value; save(); paint(f,x); }); row.appendChild(inp); });
      const del=document.createElement('button'); del.type='button'; del.className='x'; del.textContent='×'; del.setAttribute('aria-label',`${i+1}행 삭제`);
      del.onclick=()=>{ x.items.splice(i,1); if(!x.items.length) x.items.push(['','','','']); save(); draw(); paint(f,x); };
      row.appendChild(del); wrap.appendChild(row);
    });
    const add=document.createElement('button'); add.type='button'; add.className='btn'; add.textContent='+ 품목 추가';
    add.onclick=()=>{ x.items.push(['','','','']); save(); draw(); paint(f,x); }; wrap.appendChild(add);
  };
  if(!Array.isArray(x.items)) x.items=[['','','','']];
  draw(); return wrap;
}

function paint(f,x,warnEl){
  $('paper').innerHTML=f.render(x);
  if(warnEl && f.warn){ const w=f.warn(x); warnEl.textContent=w; warnEl.hidden=!w; }
}

$('btnSample').onclick=()=>{ const f=FORMS.find(x=>x.id===cur); store[f.id]=sample(f); save(); build(); };
$('btnClear').onclick=()=>{ const f=FORMS.find(x=>x.id===cur); store[f.id]=blank(f); save(); build(); };
$('btnCopy').onclick=async()=>{
  const btn=$('btnCopy'), txt=$('paper').innerText.replace(/\n{3,}/g,'\n\n');
  const done=m=>{ btn.textContent=m; setTimeout(()=>btn.textContent='문서 내용 복사',1600); };
  try{ await navigator.clipboard.writeText(txt); done('복사했습니다'); }
  catch(_){ const r=document.createRange(); r.selectNodeContents($('paper')); const s=getSelection(); s.removeAllRanges(); s.addRange(r); done('선택됨 · Ctrl+C로 복사'); }
};
build();
})();
</script>
